[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-i18n-workbench"
version = "0.1.0"
description = "中文译句语境复用、ICU 渲染门禁和可复核语言包构建工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
i18n-workbench = "i18n_workbench.cli:main"

[tool.setuptools]
py-modules = ["workbench"]

[tool.setuptools.packages.find]
include = ["i18n_workbench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
